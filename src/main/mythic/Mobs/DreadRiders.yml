# The Vanguard: a zombie lancer in netherite-dark plate under a horned armet. Hittable from its horse up.
OCCULTECH_DREAD_RIDERS_VANGUARD:
  Type: ZOMBIE
  Display: '&4The Vanguard'
  Health: 260
  Damage: 0
  Armor: 0
  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventMobKillDrops: true
    PreventItemPickup: true
    PreventSunburn: true
    KnockbackResistance: 1
    FollowRange: 32
    Silent: true
    AlwaysShowName: true
  Drops: []
  Skills:
  - model{m=occultech_dread_riders_vanguard} @self ~onSpawn
  - defaultstate{m=occultech_dread_riders_vanguard;t=walk;s=gallop} @self ~onSpawn
  - skill{s=DREAD_RIDERS_VANGUARD_STATE_CALM} @self ~onSpawn
  - bodyrotation{mh=55;mnh=-55;rde=0;rdu=3} @self ~onSpawn

