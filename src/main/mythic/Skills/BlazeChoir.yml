# Look and sound only. BlazeChoir.java decides when each of these runs and deals every hit.
# Generated by tools/art/bosses/choir_ship.py. Skills are BLAZE_CHOIR_<SINGER>_<ACTION>; the fire is painted
# neutral and tinted per state (session 6): calm, banked (shielded), hotter (a voice fell), last, dead.

BLAZE_CHOIR_SOPRANO_STRIKE:
  Skills:
  - state{m=occultech_blaze_choir_soprano;s=strike} @self
  - delay 10
  - sound{s=block.note_block.chime;v=1.6;p=1.5} @self

BLAZE_CHOIR_SOPRANO_SHIELD:
