# Look and sound only. HollowWarlord.java decides when each of these runs and deals every hit.
# Generated by tools/art/bosses/headsman_ship.py. His eyes and the sword's brand are painted neutral and
# tinted: calm 5CE8F0 (soul cyan), the sweep's tell D6FFFC, enraged C8FFFF (white-hot);
# each taken skull's fire is lit (5CE8F0) while its guard stands and dark (282C2C) once it falls.

HOLLOW_WARLORD_CALM:
  Skills:
  - tint{m=occultech_hollow_warlord;p=glow_eyes;c=5CE8F0} @self
  - tint{m=occultech_hollow_warlord;p=glow_brand;c=5CE8F0} @self
  - delay 12
  - tint{m=occultech_hollow_warlord;p=glow_eyes;c=5CE8F0} @self
  - tint{m=occultech_hollow_warlord;p=glow_brand;c=5CE8F0} @self

