# Look and sound only. DrownedElder.java decides when each of these runs and deals every hit.
# Generated by tools/art/bosses/drowned_ship.py. The eyes are painted neutral and tinted per state (session 6):
# the three beam eyes calm / lock / surged, the head's great eye calm / stare; all dark when dead.

DROWNED_ELDER_AIM:
  Skills:
  - state{m=occultech_drowned_elder;s=aim} @self
  - sound{s=entity.elder_guardian.ambient;v=2;p=0.6} @self

DROWNED_ELDER_LOCK:
  Skills:
  - tint{m=occultech_drowned_elder;p=glow_eye2;c=D6FFF6} @self
  - tint{m=occultech_drowned_elder;p=glow_eye4;c=D6FFF6} @self
  - tint{m=occultech_drowned_elder;p=glow_eye6;c=D6FFF6} @self
  - sound{s=entity.guardian.attack;v=2;p=0.5} @self

DROWNED_ELDER_STARE:
  Skills:
  - state{m=occultech_drowned_elder;s=stare} @self
  - tint{m=occultech_drowned_elder;p=glow_eye;c=8CFFE4} @self

DROWNED_ELDER_PULSE:
