  - tint{m=occultech_drowned_elder;p=glow_eye4;c=6EE8CE} @self
  - tint{m=occultech_drowned_elder;p=glow_eye6;c=6EE8CE} @self
  - tint{m=occultech_drowned_elder;p=glow_eye;c=ECE6DC} @self

DROWNED_ELDER_STATE_SURGED:
