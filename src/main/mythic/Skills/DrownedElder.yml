  - sound{s=entity.elder_guardian.curse;v=2;p=0.8} @self

DROWNED_ELDER_STARE_END:
  Skills:
  - tint{m=occultech_drowned_elder;p=glow_eye;c=ECE6DC} @self

DROWNED_ELDER_SHED:
