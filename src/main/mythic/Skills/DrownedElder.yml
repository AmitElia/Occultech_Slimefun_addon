  - tint{m=occultech_drowned_elder;p=glow_eye2;c=6EA0FF} @self
  - tint{m=occultech_drowned_elder;p=glow_eye4;c=6EA0FF} @self
  - tint{m=occultech_drowned_elder;p=glow_eye6;c=6EA0FF} @self
