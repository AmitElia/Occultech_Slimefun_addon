# Look and sound only. Tempest.java decides when each of these runs and deals every hit.
# Generated by tools/art/bosses/tempest_ship.py. The heart and glyphs are painted neutral and tinted per state
# (session 6): calm, tell (a wind-up), storm (below half), spent (the opening), dead. The breeze's eyes keep
# vanilla's colours (tint FFFFFF) except when spent or dead.

TEMPEST_VOLLEY:
  Skills:
  - state{m=occultech_tempest;s=volley} @self
  - sound{s=entity.breeze.inhale;v=2;p=0.6} @self
  - tint{m=occultech_tempest;p=glow_heart;c=D6FFF6} @self
  - tint{m=occultech_tempest;p=glow_circlet;c=D6FFF6} @self
  - tint{m=occultech_tempest;p=glow_shard0;c=D6FFF6} @self
