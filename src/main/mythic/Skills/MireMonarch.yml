# Look and sound only. MireMonarch.java decides when each of these runs and deals every hit.
# Generated by tools/art/bosses/ash_mythic_skills.py.
# The volcano's stages are BetterModel tints over the near-white lava: dormant FF8C1E (orange), from the
# eruption on deep red - awake BE190A, blown B01408 (the cap swapped for the blown top) - and dead 3C2E2A.
# The colour changes only between stages. The crater's smoke, the rocks, the lava pools and the pipe's
# smoke are drawn by the plugin.

MIRE_MONARCH_STAGE_DORMANT:
  Skills:
  - tint{m=occultech_mire_monarch;p=glow_lava;c=FF8C1E} @self
  - tint{m=occultech_mire_monarch;p=glow_lava_cap;c=FF8C1E} @self
