  - tint{m=occultech_mire_monarch;p=glow_crater_blown;c=FF8C1E} @self
  - partvisibility{m=occultech_mire_monarch;p=cone_cap;v=true} @self
  - partvisibility{m=occultech_mire_monarch;p=cone_blown;v=false} @self
