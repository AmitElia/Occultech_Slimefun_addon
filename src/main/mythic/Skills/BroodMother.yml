# Look and sound only. BroodMother.java decides when each of these runs, telegraphs, and deals every hit.
BROOD_MOTHER_POUNCE_PREPARE:
  Skills:
  # the 1 s tell (head up, front legs high, jaws wide), the leap the server throws her into, the landing
  - state{m=occultech_brood_mother;s=pounce} @self
BROOD_MOTHER_WEB_PREPARE:
  Skills:
  # the abdomen tips up and quivers through the 1.5 s warning, then jerks as the web lands
  - state{m=occultech_brood_mother;s=web} @self
BROOD_MOTHER_EGG_SAC:
  Skills:
  - state{m=occultech_brood_mother;s=egg_sac} @self
  - sound{s=entity.turtle.lay_egg;v=1.2;p=0.6} @self
