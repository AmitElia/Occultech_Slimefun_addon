# Look and sound only. DreadRiders.java decides when each of these runs and deals every hit.
# Generated by tools/art/bosses/dread_ship.py. Skills are DREAD_RIDERS_<PART>_<ACTION>; the parts are
# VANGUARD, VANGUARD_MOUNT, OUTRIDER, OUTRIDER_MOUNT. The glows are painted neutral and tinted per state;
# the survivor of a fallen pair takes the fallen rider's colour (the enrage).

DREAD_RIDERS_VANGUARD_REAR:
  Skills:
  - state{m=occultech_dread_riders_vanguard;s=rear} @self
  - sound{s=entity.zombie_horse.angry;v=2;p=0.6} @self

DREAD_RIDERS_VANGUARD_CHARGE:
  Skills:
  - state{m=occultech_dread_riders_vanguard;s=charge} @self
