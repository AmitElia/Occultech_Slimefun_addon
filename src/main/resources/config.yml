# Occultech configuration
options:
  # Print extra information (ritual matching, boss phases) to the console
  debug: false

bosses:
  # Multiplies every boss's health (1.0 = as designed, 0.8 = 20% less)
  health-multiplier: 1.0
  # Boss health for a group in the arena at the summon: x(1 + group-scaling * (players - 1)^group-exponent), counting at
  # most group-cap players. Defaults: x1.45 / 1.76 / 2.03 / 2.27 for 2-5 players, so a group always kills faster than solo
  group-scaling: 0.45
  group-exponent: 0.75
  group-cap: 5
  # Boss fights (running, or a summon still channeling) must be at least this many blocks apart; arenas never overlap
  min-fight-distance: 96
  # Seconds a fight waits with nobody alive in its arena before it ends (the catalyst is lost). While everyone has
  # walked off, the boss recovers; after a death or disconnect it waits as it is
  away-seconds: 180

brood-egg:
  # Seconds between strings. Only counts while the chunk is loaded; no catch-up for offline time.
  seconds-per-string: 20

phantom-roost:
  # Seconds between phantom membranes (same rules as the Brood Egg).
  seconds-per-membrane: 90

pearl-bed:
  # Seconds between prismarine items (shard, shard, crystals, repeating; same rules as the Brood Egg).
  seconds-per-item: 60

ember-brazier:
  # Seconds between blaze powder (same rules as the Brood Egg).
  seconds-per-item: 60

showcase:
  # The player whose skin the showcase studios' mannequins wear (looked up by name; empty for the default skin).
  skin: S4MURAI
  # /occultech studio: the camera's distance (blocks) from a block / ritual altar, from the mannequin's right hand
  # (weapons) and from the armor mannequin's chest; how long the armor turntable takes for one full turn.
  camera:
    block-distance: 2.6
    hand-distance: 1.1
    armor-distance: 3.0
    turn-seconds: 16

custom-blocks:
  # Occultech's blocks as real custom blocks, like Nexo makes them: each block look is a note-block (or, for the flat
  # ritual glyphs, a tripwire) state that the resource pack shows as the block's model. auto: on, unless Nexo is
  # installed (Nexo owns those states; blocks keep their display skins until the Nexo hookup - docs/nexo-migration.md).
  # blocks: always on. skins: the older display-entity skins.
  # Needs block-updates.disable-noteblock-updates and disable-tripwire-updates: true in config/paper-global.yml.
  mode: auto
resource-pack:
  # Give Occultech items their own models (the `item_model` component, namespace "occultech"; no vanilla item is
  # retextured). Without the pack loaded, those items show as a missing model - so keep delivery on, or carry the pack
  # with another plugin.
  item-models: true
  # auto: hand the pack to Nexo if it is installed, otherwise serve it ourselves. nexo | self-host | off
  mode: auto
  # self-host only: the port of the built-in web server, and the address players download it from. Leave public-host
  # empty to use the address each player connected with (works for LAN and internet players alike). The port must be
  # reachable like the game port: allowed in the firewall and forwarded on the router. Behind a proxy or a host with
  # one open port, put the pack on a web host and use mode: off.
  port: 8164
  public-host: ""
  # The port players reach, if it differs from `port` - a playit.gg / ngrok tunnel or a router mapping usually gives
  # a different public port for the tunnel to local port 8164. 0 = same as `port`.
  public-port: 0
  # Or host the pack anywhere on the web (no extra port or tunnel needed): put the direct download link here and upload
  # plugins/Occultech/occultech-pack.zip there after each Occultech update. The server still checks its hash.
  external-url: ""
  # self-host only: kick players who decline the pack (they would see missing models otherwise)
  required: false
  prompt: "Occultech's textures: rituals, relics and bosses look as they should."
