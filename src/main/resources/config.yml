# Occultech configuration
options:
  # Print extra information (ritual matching, boss phases) to the console
  debug: false

bosses:
  # Multiplies every boss's health (1.0 = as designed, 0.8 = 20% less)
  health-multiplier: 1.0
  # Boss health for a group in the arena at the summon: x(1 + group-scaling * (players - 1)^group-exponent), counting at
  # most group-cap players. Defaults: x1.45 / 1.76 / 2.03 / 2.27 for 2-5 players, so a group always kills faster than solo
  group-scaling: 0.45
  group-exponent: 0.75
  group-cap: 5
  # Boss fights (running, or a summon still channeling) must be at least this many blocks apart; arenas never overlap
  min-fight-distance: 96
  # Seconds a fight waits with nobody alive in its arena before it ends (the catalyst is lost). While everyone has
  # walked off, the boss recovers; after a death or disconnect it waits as it is
  away-seconds: 180

raid:
  # The Staff Raid (docs/staff-raid.md): a server-wide event admins run at a preset arena with /occultech event.
  # Set the arena by standing in its middle: /occultech event arena set <radius>. It's saved in raid-arena.yml.
  # Act 1: one staff member per this many players is on the floor at once (2 to max-targets)
  players-per-target: 2.5
  max-targets: 10
  # A staff member's health for one player, before raid scaling. Health grows as (players per staff member)^health-exponent
  staff-health: 600
  health-exponent: 0.9
  # Multiplies all raid health (also live with /occultech event hp <multiplier>)
  health-multiplier: 1.0
  # Act 1 ends after kills-per-target x (staff on the floor) staff are beaten, or after act1-minutes
  kills-per-target: 2
  act1-minutes: 8
  # Act 2: the Council's shared health for one player, before raid scaling (x players^health-exponent x health-multiplier)
  council-health: 6000
  # Who sits on the Council. name = Minecraft username (their skin), display = the name shown, title = the line under it
  council:
    founder: {name: XmpriX, display: X, title: Community Founder}
    archer: {name: Leyfr, display: Chlo, title: Partnered Owner}
    brewer: {name: PancakeAcoustics, display: Pancake, title: Staff COO}
  # Who can appear. name = Minecraft username (their skin unless skin: is set), display = the name shown, title = the
  # line under it. archetype: bruiser, controller, skirmisher, summoner, gadgeteer or hexer. signatures: their own
  # abilities. with: a partner who fights in the same slot (the partner isn't picked on their own). scale: body size.
  roster:
    - {name: MrTroxy, display: MrTroxy, title: Lead Dev, archetype: gadgeteer, signatures: [hotfix, system_bug, rollback]}
    - {name: Djtmk, display: Dj, title: Java Dev, archetype: gadgeteer, signatures: [hotfix, system_bug, rollback]}
    - {name: AbusingYTRank, display: Abusing, title: Head Admin, archetype: bruiser, signatures: [replicas, big_fuse]}
    - {name: jollydiger, display: Jolly, title: Moderator, archetype: skirmisher, signatures: [trick_arrows, fart_jump, whoopee_cushions]}
    - {name: S4MURAI, display: S4MURAI, title: SF Creative Director, archetype: skirmisher, signatures: [enderstep, swap, katana]}
    - {name: justafable, display: justafable, title: Head Admin, archetype: bruiser}
    - {name: charlesfinley, display: Charles, title: Head Admin, archetype: controller, signatures: [meteors, moons, black_hole, low_gravity]}
    - {name: pyr0xite, display: pyr0, title: Head Admin, archetype: bruiser, signatures: [stampede, moo, milk, hay]}
    - {name: mrlonelydwarf, display: mrlonelydwarf, title: Head Admin, archetype: skirmisher, signatures: [burrow]}
    - {name: EarlTheDwarf, display: Earl, title: Moderator, archetype: bruiser, signatures: [bond, together, rescue], with: SneakySamInc, scale: 0.7}
    - {name: SneakySamInc, display: Sam, title: Head Admin, archetype: skirmisher, signatures: [bond, together, rescue, daggers]}
    - {name: goobtbh, display: goob, title: Admin, archetype: controller, signatures: [flight]}
