# Occultech configuration
options:
  # Print extra information (ritual matching, boss phases) to the console
  debug: false

bosses:
  # Multiplies every boss's health (1.0 = as designed, 0.8 = 20% less)
  health-multiplier: 1.0
  # Extra boss health for each additional player in the arena when it is summoned (0.25 = +25% per player)
  health-per-extra-player: 0.25

brood-egg:
  # Seconds between strings. Only counts while the chunk is loaded; no catch-up for offline time.
  seconds-per-string: 20

phantom-roost:
  # Seconds between phantom membranes (same rules as the Brood Egg).
  seconds-per-membrane: 90

pearl-bed:
  # Seconds between prismarine items (shard, shard, crystals, repeating; same rules as the Brood Egg).
  seconds-per-item: 60

ember-brazier:
  # Seconds between blaze powder (same rules as the Brood Egg).
  seconds-per-item: 60
