# Occultech - full item and recipe list (DRAFT)
#
# Input key prefixes:  mc:<MATERIAL> = vanilla item   sf:<ID> = base Slimefun item   <ID> = Occultech item
# Every Occultech item id gets the OCCULTECH_ prefix in game.
# Checked by tools/cost_model.py (raw cost, crafting steps, boss drops needed, slot limits) -> docs/items.md
#
# Recipe types
#   ENHANCED_CRAFTING_TABLE / MAGIC_WORKBENCH / ARMOR_FORGE : 3x3, 1 item per slot (max 9)
#   ARCANE_ALTAR : Occultech's altar (tier 0): shapeless, 9 input slots, stacks allowed
#   ANCIENT_ALTAR : center + 8 pedestals, 1 item each (max 9)
#   SMELTERY : Slimefun smeltery, 1 item per slot (max 9)
#   RITUAL : Occultech. `center` item on the altar + offerings in bowls (a bowl holds a stack).
#            `circle` = minimum circle tier. Bowl count per circle: 0:4, 1:8, 2:8, 3:12
#   OCCULT_FORGE / SOUL_CONDENSER : Occultech electric machines (tier 2). Up to 4 inputs, stacks allowed.
#   HOLLOW_ASSEMBLER : Occultech electric assembler (tier 3): 9 input slots, stacks allowed (max 36 items in all)
#   BOSS_DROP : only obtainable from the named boss. `chance` (default 1) = bonus drop rolled per contributor per win,
#               for extra drops besides the boss's main drop.
#
# Weapons use item durability (never Slimefun energy); they stop working at 1 durability instead of breaking,
# and are repaired in an anvil with the listed boss drop. Mending is disabled. See docs/mechanics.md.
#   material : vanilla item used for the look (required for tiers that are implemented in code)
#   enchants : optional enchantments on the item, may exceed vanilla levels (e.g. {THORNS: 5})
#   head     : optional player-head texture (the base64 texture value or the textures.minecraft.net hash); replaces the material look
#   durability / repair : max durability and the item that repairs it in a repair ritual (weapon on the altar, repair items in bowls, 25% each)
#   in_place : RITUAL whose center is the altar block itself (altar left empty); the result replaces the altar block
#   alt_recipes : optional extra routes to the same item (e.g. a machine that automates it). Costs use `recipe`.
#
# Progression rules used here
#   - A tier's gate drop is only used in the next tier's altar, machines and capstones - never in
#     base materials - so later tiers don't require re-farming early bosses.
#   - Catalysts use one of each of the tier's mini-boss drops (the minis come before the gate boss).

tiers:
  0: {name: Initiate, gear: "iron gear, little or no enchanting", raw_target: [100, 1000], circle: "5x5"}
  1: {name: Bound, gear: "basic diamond gear (low enchants)", raw_target: [1000, 10000], circle: "7x7"}
  2: {name: Abyssal, gear: "max-enchanted netherite", raw_target: [10000, 100000], circle: "9x9"}
  3: {name: Hollow, gear: "InfinityExpansion2 gear", raw_target: [100000, 1000000], circle: "11x11"}

# Built once per tier; higher circles contain the lower ones and can run their rituals.
circles:
  0: {INITIATE_ALTAR: 1, CHALK_GLYPH: 16, OFFERING_BOWL: 4, TALLOW_CANDLE: 4}
  1: {BOUND_ALTAR: 1, CHALK_GLYPH: 16, BOUND_GLYPH: 16, OFFERING_BOWL: 8, TALLOW_CANDLE: 8}
  2: {ABYSSAL_ALTAR: 1, CHALK_GLYPH: 16, BOUND_GLYPH: 16, ABYSSAL_GLYPH: 28, OFFERING_BOWL: 8, TALLOW_CANDLE: 12}
  3: {HOLLOW_ALTAR: 1, CHALK_GLYPH: 16, BOUND_GLYPH: 16, ABYSSAL_GLYPH: 28, HOLLOW_GLYPH: 32, OFFERING_BOWL: 12, TALLOW_CANDLE: 16}

# kind: lesser = repeatable mini-boss, major = the tier's gate boss (needs a catalyst)
# drops: guaranteed minimum per win per contributor (small random bonus on top, not counted here)
# mob_drops: vanilla items "min-max" and xp, given to each contributor from the boss itself (never from its extra mobs).
#            Keep these to common drops - nothing other progression gates (totems, skulls, nether stars).
